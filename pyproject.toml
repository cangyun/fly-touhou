[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fly-touhou"
version = "0.2.0.dev101"
description = "Native Touhou process control with a FlyWire-constrained spiking student and teacher-guided learning"
requires-python = ">=3.11"
readme = "README.md"
license = "AGPL-3.0-or-later"
dependencies = ["numpy>=1.26,<2", "torch>=2.8", "pandas>=2", "pyarrow>=14", "scipy>=1.11", "gymnasium==1.2.0", "stable-baselines3==2.7.0", "sb3-contrib==2.7.0", "psutil>=5.9", "Pillow>=10", "frida==17.24.1", "optuna>=5,<6", "pywin32>=306; sys_platform == 'win32'"]

[project.scripts]
fly-touhou = "fly_touhou.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fly_touhou = ["hooks/*.js", "csrc/*.cu", "csrc/*.cpp", "csrc/**/*.cu", "csrc/**/*.cpp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
